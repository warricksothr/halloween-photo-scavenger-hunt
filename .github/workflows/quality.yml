# This repository runs CI on the internal Forgejo host.
# The public GitHub mirror intentionally has no automatic CI job.
# Forgejo executes .forgejo/workflows/quality.yml with its Docker runner.
name: Quality pointer

on:
  workflow_dispatch:

jobs:
  pointer:
    name: See the Forgejo quality workflow
    runs-on: ubuntu-latest
    steps:
      - name: Explain the CI location
        run: |
          echo "Internal CI: .forgejo/workflows/quality.yml"
          echo "The public GitHub mirror does not run the quality gate."
