[project]
name = "arkham-hunt-server"
version = "0.1.0"
description = "FastAPI backend for the Arkham Halloween photo scavenger hunt"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "argon2-cffi>=23.1",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
    # Starlette 1.x uses httpx2 for TestClient. Keeping this explicit avoids
    # its deprecated fallback to the original httpx package.
    "httpx2>=2.0,<3.0",
    # Starlette 1.6 still imports anyio.abc.BlockingPortal, which AnyIO
    # 4.15 deprecates at import time. Keep the test stack warning-free until
    # Starlette moves to anyio.from_thread.BlockingPortal.
    "anyio>=4.0,<4.15",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["server/app"]

[tool.coverage.report]
# The branch-aware baseline is 93%. Keep 3 percentage points for new paths
# while requiring every quality run to report uncovered lines.
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# E/F catch syntax and correctness defects; I keeps imports deterministic.
select = ["E4", "E7", "E9", "F", "I"]
