<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Arkham Hunt</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- iOS takes its home-screen icon from here, not from the manifest,
       and falls back to a page snapshot without it (scripts/render-icons.mjs). -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Arkham Hunt">
  <!-- Theme fonts: Rajdhani (headings/body) + Orbitron (numerals/glyphs).
       Loaded once here; theme CSS only references the families. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Service worker: app-shell cache so the party survives venue wifi
    // drops. /api is network-only — game state must never be served stale.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
