# nginx reverse proxy for the Arkham hunt — the public face of the
# single uvicorn process. nginx terminates TLS and proxies everything to
# 127.0.0.1:8000 (the app serves the built PWA itself, so there is no
# static root to configure here).
#
# Install: copy to /etc/nginx/sites-available/arkham-hunt, symlink into
# sites-enabled, set server_name, provision TLS (certbot), reload nginx.
#
# THE line that matters for this app: proxy_buffering off on the SSE
# location. Without it nginx buffers the event stream and deltas arrive
# in ~4 kB batches instead of live — the queue looks frozen while
# submissions pile up behind the buffer. (The app also sends
# X-Accel-Buffering: no on the stream, but do not rely on the header
# alone — set the directive.)

server {
    listen 80;
    server_name hunt.example.com;   # ← your hostname
    # certbot will add the 443 server block and the redirect; or write
    # your own TLS config here.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hunt.example.com;   # ← your hostname

    # certbot-managed paths (adjust if you hand-roll TLS):
    ssl_certificate     /etc/letsencrypt/live/hunt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hunt.example.com/privkey.pem;

    # Photos are the biggest payload the app moves. Keep this ABOVE the
    # server's own cap (MAX_BYTES in app/images.py): the app then rejects
    # an oversize upload with its JSON error, instead of nginx cutting it
    # off first with an HTML 413 page.
    client_max_body_size 16m;

    # Security headers. `always` keeps them on error responses too. The
    # CSP allows exactly what the built PWA needs — inline script for the
    # service-worker registration and Preact's inline styles, plus the
    # Google Fonts in web/index.html — and nothing else.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://glitchtip.nulloctet.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/events/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # The rate limiter keys on the client IP (app/ratelimit.py). Pass
        # the real player through; uvicorn trusts it only because it runs
        # with --proxy-headers --forwarded-allow-ips=127.0.0.1
        # (deploy/arkham-hunt.service). Without both halves every request
        # looks like it came from 127.0.0.1 and one noisy client throttles
        # the party.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE: unbuffered, unchunked, long-lived.
        proxy_buffering off;
        proxy_cache off;
        # The app heartbeats every 15s, so 300s of read patience is
        # generous; the default 60s would drop idle streams.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # No buffering games needed for plain request/response — the
        # defaults are fine for JSON and photos.
    }
}
